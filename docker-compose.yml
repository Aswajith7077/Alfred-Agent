services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_URL: "http://ollama:11434"
      VAULT_PATH: "/app/vault"
      EMAIL_ADDRESS_I: ${EMAIL_ADDRESS_I:-}
      EMAIL_ADDRESS_II: ${EMAIL_ADDRESS_II:-}
      EMAIL_APP_PASSWORD_I: ${EMAIL_APP_PASSWORD_I:-}
      EMAIL_APP_PASSWORD_II: ${EMAIL_APP_PASSWORD_II:-}
      HUGGING_FACE_TOKEN: ${HUGGING_FACE_TOKEN:-}
    volumes:
      - backend-db:/app/db
      - ./backend/secrets:/app/secrets
      - ./backend/keys:/app/keys
      - ${VAULT_PATH:-./obsidian-vault}:/app/vault
    # The agent reads queries from stdin (input(">>> ")), so it needs a TTY
    # attached: `docker compose run --rm backend` (not `up -d`) for interactive use.
    stdin_open: true
    tty: true

  frontend:
    build:
      context: ./dynamic-island
      dockerfile: Dockerfile
    ports:
      - "8080:80"

volumes:
  ollama-models:
  backend-db:
